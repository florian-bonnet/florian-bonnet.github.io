project:
  type: website
  output-dir: _site

website:
  title: "Florian Bonnet"
  site-url: "https://florian-bonnet.github.io"
  description: "Chargé de recherches at INED. Mortality, spatial inequalities, demography."

  # Barre de navigation principale (en anglais, identique pour les deux langues)
  navbar:
    background: primary
    search: true
    href: en/index.qmd
    left:
      - href: en/index.qmd
        text: Home
      - text: Research
        menu:
          - href: en/research/themes.qmd
            text: Themes
          - href: en/research/publications.qmd
            text: Publications
          - href: en/research/tools.qmd
            text: Tools & Data
      - href: en/media.qmd
        text: Media
      - href: en/teaching.qmd
        text: Teaching
      - href: en/cv.qmd
        text: CV
    right:
      - href: "{{< meta other-lang-href >}}"
        text: "EN / FR"

  # Pied de page (identique EN/FR)
  page-footer:
    left: "© 2026 Florian Bonnet"
    right:
      - icon: envelope
        href: mailto:florian.bonnet@ined.fr

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: true
    toc-location: right
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    fontsize: 1rem